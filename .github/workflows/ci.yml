name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CUDA_VISIBLE_DEVICES: "-1"
      TF_CPP_MIN_LOG_LEVEL: "2"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install package with dev extras (builds the Rust polarize extension)
        run: uv sync --group dev

      - name: Lint for undefined names (missing imports crash only at runtime)
        run: uvx ruff check --isolated --select F821,F822,F823 --output-format concise --extend-exclude test_code flexsweep/

      - name: Unit and docs tests
        run: uv run pytest tests -m "not slow" -q

      - name: End-to-end CLI smoke test (simulator -> fvs-discoal -> cnn, scan)
        run: uv run pytest tests/test_cli_smoke.py -m slow -q

  # Downloads the example inputs from Zenodo (170 MB); run manually.
  example:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - name: Example data and scan steps
        run: |
          set -euo pipefail
          uv run flexsweep example --output_folder ex --nthreads 2 --steps data,scan
