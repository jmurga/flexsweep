version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

# Docs are built from the source tree (docs/conf.py puts the repo root on sys.path),
# so the package itself is not installed: that would need a Rust toolchain for the
# polarize extension and the multi-GB tensorflow[and-cuda] wheels.
python:
  install:
    - requirements: docs/requirements.txt

sphinx:
  configuration: docs/conf.py

formats:
  - pdf
